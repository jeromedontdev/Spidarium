name: Publish website

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate deterministic pixel artwork
        run: |
          python -m pip install Pillow
          python -m unittest discover -s tools -p test_art_style.py -v
          python tools/asset_build.py --png-only
      - name: Test browser logic
        working-directory: site
        run: npm ci && npm test
      - name: Fetch official firmware, never local saves
        env:
          GH_TOKEN: ${{ github.token }}
          # A release event names its own tag. A manual dispatch runs against a
          # ref, so use that ref's name when it is a release tag; a dispatch from
          # a branch (a website-only change) falls back to the latest published
          # release, so the site never ships a stale or missing firmware bundle.
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            echo "No release named '$RELEASE_TAG'; using latest published release '$tag'."
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "spidarium-$tag.zip" --dir "$RUNNER_TEMP"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "spidarium.bin" --pattern "spidarium-ota.json" --dir "$RUNNER_TEMP"
          python tools/prepare_website.py "$RUNNER_TEMP/spidarium-$tag.zip" --ota-assets "$RUNNER_TEMP"
      - name: Build website and bundled flasher
        working-directory: site
        run: npm run build
      - name: Copy published pixel artwork
        run: python tools/prepare_website.py --assets-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
